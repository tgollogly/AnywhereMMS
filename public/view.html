<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>View Photo — AnywhereMMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body class="view-page">
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-icon">📸</span>
        AnywhereMMS
      </a>
    </div>
  </header>

  <div class="view-content">
    <div id="loading">
      <div class="spinner"></div>
      <p style="color: var(--text-muted);">Loading your image…</p>
    </div>

    <div id="viewError" class="status status-error hidden" style="max-width: 480px;"></div>

    <div id="viewContent" class="hidden">
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">📸 Your Photo</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Someone shared this image with you via AnywhereMMS.</p>

      <div class="view-image-wrapper">
        <img id="viewImage" alt="Shared photo">
      </div>

      <p class="view-meta">Expires: <span id="expiresAt">—</span></p>
      <p id="compressionNote" class="view-meta"></p>

      <div class="privacy-notice-inline">
        🔒 This link is private and will expire automatically. Do not share publicly. <a href="/privacy.html">Privacy Policy</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 tgollogly · <a href="/privacy.html">Privacy</a> · <a href="/cookies.html">Cookies</a></p>
    </div>
  </footer>

  <script src="/js/cookies.js"></script>
  <script src="/js/view.js"></script>
</body>
</html>
