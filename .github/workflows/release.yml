name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          RELEASE_DIR="${{ runner.temp }}/release"
          mkdir -p "$RELEASE_DIR"
          PKG_TGZ="$(npm pack --silent)"
          mv "$PKG_TGZ" "$RELEASE_DIR/"
          git archive --format=zip --output "$RELEASE_DIR/AnywhereMMS-${VERSION}-source.zip" HEAD
          cd "$RELEASE_DIR"
          sha256sum * > SHA256SUMS.txt
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-checksums: ${{ env.release_dir }}/SHA256SUMS.txt

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES_FILE="${{ runner.temp }}/release-notes.md"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release ${GITHUB_REF_NAME}" > "$NOTES_FILE"
          fi
          {
            echo ""
            echo "🔒 These files are sealed: SHA-256 checksums in SHA256SUMS.txt plus GitHub build attestations. See the README \"Verify your download\" section to check them."
          } >> "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ env.release_dir }}/anywheremms-${{ steps.meta.outputs.version }}.tgz
            ${{ env.release_dir }}/AnywhereMMS-${{ steps.meta.outputs.version }}-source.zip
            ${{ env.release_dir }}/SHA256SUMS.txt