<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <!-- Phone icon -->
  <rect x="40" y="40" width="80" height="120" rx="12" stroke="url(#accent)" stroke-width="3" fill="none"/>
  <circle cx="80" cy="140" r="6" fill="#06b6d4"/>
  <!-- Arrow -->
  <path d="M150 100h80" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <path d="M210 100l-12-12M210 100l-12 12" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cloud/server -->
  <ellipse cx="320" cy="90" rx="50" ry="30" fill="url(#accent)" opacity="0.3"/>
  <rect x="280" y="80" width="80" height="60" rx="8" stroke="url(#accent)" stroke-width="3" fill="none"/>
  <path d="M295 105h50M295 120h35" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrow 2 -->
  <path d="M390 100h80" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <path d="M450 100l-12-12M450 100l-12 12" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- SMS bubble -->
  <rect x="490" y="55" width="120" height="90" rx="12" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="2"/>
  <text x="510" y="85" fill="#818cf8" font-family="Inter, sans-serif" font-size="14" font-weight="600">SMS</text>
  <text x="510" y="110" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">View your photo:</text>
  <text x="510" y="128" fill="#06b6d4" font-family="Inter, sans-serif" font-size="10">anywheremms.io/v/abc</text>
  <!-- Image preview -->
  <rect x="640" y="50" width="120" height="100" rx="10" stroke="#10b981" stroke-width="2" fill="none"/>
  <circle cx="700" cy="85" r="15" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M660 130l25-25 15 15 20-30 25 40H660z" fill="#10b981" opacity="0.4"/>
  <!-- Title -->
  <text x="40" y="185" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="22" font-weight="800">AnywhereMMS</text>
  <text x="220" y="185" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Capture ’ Compress ’ Upload ’ SMS Link ’ View</text>
</svg>
